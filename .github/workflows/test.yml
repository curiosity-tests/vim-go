name: test
run-name: "test ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  lint:
    if: false   # racecar: scan/report job, not a build
    name: lint
    runs-on: ubuntu-22.04
    steps:
    - name: set up python
      uses: actions/setup-python@v5.5.0
      with:
        python-version: 3.7
    - name: install vim-vint
      run: |
        python -m pip install --upgrade pip
        pip install vim-vint pathlib
    - name: checkout
      uses: actions/checkout@v2.1.0
    - name: install vim
      run: $GITHUB_WORKSPACE/scripts/install-vim vim-9.1
    - name: install tools
      run: $GITHUB_WORKSPACE/scripts/install-tools vim-9.1
    - name: lint
      run: $GITHUB_WORKSPACE/scripts/lint vim-9.1
  test:
    name: test
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26','1.27']
        vim: ['vim-8.2', 'vim-9.1', 'nvim']
    steps:
    - name: setup Go
      uses: actions/setup-go@v2.1.3
      with:
        go-version: ${{ matrix.go }}
    - name: set up python
      uses: actions/setup-python@v5.5.0
      with:
        python-version: 3.7
    - name: install covimerage
      run: |
        python -m pip install --upgrade pip
        pip install click==7.1.2 covimerage==0.2.1 codecov pathlib
    - name: checkout
      uses: actions/checkout@v2.1.0
    - name: install vim
      run: $GITHUB_WORKSPACE/scripts/install-vim ${{ matrix.vim }}
    - name: install tools
      run: $GITHUB_WORKSPACE/scripts/install-tools ${{ matrix.vim }}
    - name: test
      run: $GITHUB_WORKSPACE/scripts/test -c ${{ matrix.vim }}
    - uses: codecov/codecov-action@v1
      with:
        # token is not required for public repos
        #token: ${{ secrets.CODECOV_TOKEN }}
        file: $GITHUB_WORKSPACE/coverage.xml
        flags: unittests
        name: vim-go
        fail_ci_if_error: false
